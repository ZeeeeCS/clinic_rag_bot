# config/settings.yaml
models:
  generation: "groq/compound-mini"
  generation_provider: "groq"


generator:
  primary_model: "groq/compound-mini"
  fallback_model: "llama-3.1-8b-instant"
  temperature: 0.3
  max_tokens: 1024
  api_key_env: "GROQ_API_KEY"
  base_url: "https://api.groq.com/openai/v1"
retrieval:
  top_k: 4
  similarity_threshold: 0.55   # below this → treat as "no confident match"

safety:
  hard_escalation_keywords: ["chest pain", "can't breathe", "bleeding heavily", "suicidal", "want to die", "overdose"]

logging:
  level: "INFO"
  log_file: "logs/app.log"
vector_store:
  mode: "local"   # switch to "cloud" when you deploy
  persist_path: "./data/chroma_db"